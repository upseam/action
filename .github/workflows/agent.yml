name: upseam-agent
on:
  workflow_call:
    inputs:
      runner:
        description: The coding agent, the same value as agent.runner in .github/upseam.yml; claude-code, codex, opencode, hermes or openclaw.
        type: string
        required: true
      model:
        description: provider/model id for opencode, hermes and openclaw; empty for claude-code and codex.
        type: string
        required: false
        default: ""
    secrets:
      model-key:
        description: The agent's credential. Claude Code takes a claude setup-token OAuth token or an Anthropic API key, Codex an OpenAI API key, the others the API key of the model provider.
        required: true
permissions: {}
concurrency: upseam-agent-${{ github.event.client_payload.group }}
env:
  FILES: ${{ toJSON(github.event.client_payload.files) }}
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      provider: ${{ steps.check.outputs.provider }}
      id: ${{ steps.check.outputs.id }}
      host: ${{ steps.check.outputs.host }}
      key: ${{ steps.check.outputs.key }}
    steps:
      - name: Check the runner, the model and the event
        id: check
        env:
          RUNNER: ${{ inputs.runner }}
          MODEL: ${{ inputs.model }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          SENT: ${{ github.event.client_payload.runner }}
        run: |
          set -euo pipefail
          [ "$EVENT" = repository_dispatch ] && [ "$ACTION" = upseam-agent ] || { echo "::error::The Upseam agent workflow runs only on the upseam-agent repository_dispatch event."; exit 1; }
          case "$RUNNER" in
            claude-code | codex) providers="" ;;
            opencode) providers="anthropic openai openrouter" ;;
            hermes | openclaw) providers="anthropic openrouter" ;;
            *) echo "::error::Unknown runner. Use claude-code, codex, opencode, hermes or openclaw."; exit 1 ;;
          esac
          [ "$RUNNER" = "$SENT" ] || { echo "::error::The runner input does not match agent.runner in .github/upseam.yml."; exit 1; }
          if [ -z "$providers" ]; then
            [ -z "$MODEL" ] || { echo "::error::Leave model empty for $RUNNER."; exit 1; }
            exit 0
          fi
          [[ "$MODEL" =~ ^[a-z]+/[A-Za-z0-9._:/-]+$ ]] || { echo "::error::Set model to provider/model id."; exit 1; }
          provider="${MODEL%%/*}"
          case " $providers " in *" $provider "*) ;; *) echo "::error::$RUNNER supports the providers $providers."; exit 1 ;; esac
          case "$provider" in
            anthropic) host=api.anthropic.com key=ANTHROPIC_API_KEY ;;
            openai) host=api.openai.com key=OPENAI_API_KEY ;;
            openrouter) host=openrouter.ai key=OPENROUTER_API_KEY ;;
          esac
          {
            echo "provider=$provider"
            echo "id=${MODEL#*/}"
            echo "host=$host"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"
  claude-code:
    needs: runner
    if: inputs.runner == 'claude-code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          claude_code_oauth_token: ${{ startsWith(secrets.model-key, 'sk-ant-oat') && secrets.model-key || '' }}
          anthropic_api_key: ${{ !startsWith(secrets.model-key, 'sk-ant-oat') && secrets.model-key || '' }}
          github_token: ${{ github.token }}
          allowed_bots: ${{ github.actor }}
          prompt: ${{ github.event.client_payload.task }}
          settings: '{"permissions":{"blockReadsOutsideWorkingDirectories":true,"deny":["Read(//proc/**)","Read(//sys/**)","Read(//etc/**)","Read(//tmp/**)","Read(./.git/**)","Edit(./.git/**)","Edit(./.github/**)","Edit(//home/runner/work/_actions/**)","Edit(//home/runner/work/_temp/**)","Edit(//tmp/**)"]}}'
          claude_args: --allowedTools Read,Edit,Glob,Grep --disallowedTools Bash,WebFetch,WebSearch --max-turns 30
      - run: rm -rf .upseam-check
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.client_payload.sha }}
          path: .upseam-check
          persist-credentials: false
      - name: Copy the listed files into the fresh checkout
        run: |
          set -euo pipefail
          total=0
          while IFS= read -r -d '' f; do
            case "$f" in "" | /* | ../* | */../* | */.. | .git/* | */.git/*) echo "::error::Bad path in files."; exit 1 ;; esac
            if [ -f "$f" ] && [ ! -L "$f" ] && [ -f ".upseam-check/$f" ] && [ ! -L ".upseam-check/$f" ]; then
              total=$((total + $(stat -c %s -- "$f")))
              [ "$total" -le 1048576 ] || { echo "::error::The edits are over 1 MB."; exit 1; }
              cp -- "$f" ".upseam-check/$f"
            fi
          done < <(jq -j '.[] | ., "\u0000"' <<<"$FILES")
      - uses: upseam/action@7b5c3d93de9a0e879364ab4b4415b3acdd138419 # v0.2.0
        with:
          path: .upseam-check
          check-only: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upseam-edits
          path: ${{ runner.temp }}/upseam-edits
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  codex:
    needs: runner
    if: inputs.runner == 'codex'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.model-key }}
          prompt: ${{ github.event.client_payload.task }}
          permission-profile: ":workspace"
          allow-bot-users: ${{ github.actor }}
      - run: rm -rf .upseam-check
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.client_payload.sha }}
          path: .upseam-check
          persist-credentials: false
      - name: Copy the listed files into the fresh checkout
        run: |
          set -euo pipefail
          total=0
          while IFS= read -r -d '' f; do
            case "$f" in "" | /* | ../* | */../* | */.. | .git/* | */.git/*) echo "::error::Bad path in files."; exit 1 ;; esac
            if [ -f "$f" ] && [ ! -L "$f" ] && [ -f ".upseam-check/$f" ] && [ ! -L ".upseam-check/$f" ]; then
              total=$((total + $(stat -c %s -- "$f")))
              [ "$total" -le 1048576 ] || { echo "::error::The edits are over 1 MB."; exit 1; }
              cp -- "$f" ".upseam-check/$f"
            fi
          done < <(jq -j '.[] | ., "\u0000"' <<<"$FILES")
      - uses: upseam/action@7b5c3d93de9a0e879364ab4b4415b3acdd138419 # v0.2.0
        with:
          path: .upseam-check
          check-only: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upseam-edits
          path: ${{ runner.temp }}/upseam-edits
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  opencode:
    needs: runner
    if: inputs.runner == 'opencode'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - name: Install OpenCode 1.18.32 and ripgrep 15.1.0
        run: |
          set -euo pipefail
          [ -z "${XDG_DATA_HOME:-}" ] && [ "$HOME" = /home/runner ] || { echo "::error::The OpenCode job needs a GitHub-hosted Ubuntu runner without XDG_DATA_HOME."; exit 1; }
          dir="$RUNNER_TEMP/opencode"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' -o "$dir/opencode.tgz" https://registry.npmjs.org/opencode-linux-x64/-/opencode-linux-x64-1.18.32.tgz
          echo "0886adbe8ca2f15e5ae7ac72c3a6549ec2b107dc2a60866a7cd7aa50d5a10416386843409bdd3b2cfd315c0c0bead4747186ea365dbe0efc7c98ea972316c379  $dir/opencode.tgz" | sha512sum -c -
          tar -xzf "$dir/opencode.tgz" -C "$dir" package/bin/opencode
          curl -fsSL --proto '=https' -o "$dir/rg.tgz" https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $dir/rg.tgz" | sha256sum -c -
          bin="${XDG_CACHE_HOME:-$HOME/.cache}/opencode/bin"
          mkdir -p "$bin"
          tar -xzf "$dir/rg.tgz" -C "$bin" --strip-components=1 ripgrep-15.1.0-x86_64-unknown-linux-musl/rg
          config="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
          mkdir -p "$config/node_modules"
          echo '{"dependencies":{"@opencode-ai/plugin":"1.18.32"}}' > "$config/package.json"
          echo '{"lockfileVersion":3,"packages":{"":{"dependencies":{"@opencode-ai/plugin":"1.18.32"}}}}' > "$config/package-lock.json"
      - name: Run OpenCode
        env:
          MODEL_KEY: ${{ secrets.model-key }}
          KEY_NAME: ${{ needs.runner.outputs.key }}
          MODEL: ${{ inputs.model }}
          TASK: ${{ github.event.client_payload.task }}
          OPENCODE_CONFIG_CONTENT: '{"autoupdate":false,"share":"disabled","snapshot":false,"lsp":false,"formatter":false,"permission":{"*":"deny","read":{"*":"allow","*.env":"deny","*.env.*":"deny",".git":"deny",".git/*":"deny"},"glob":"allow","grep":"allow","edit":{"*":"allow",".git":"deny",".git/*":"deny",".github/*":"deny","opencode.json":"deny","opencode.jsonc":"deny",".opencode/*":"deny"},"bash":"deny","webfetch":"deny","websearch":"deny","task":"deny","skill":"deny","question":"deny","lsp":"deny","external_directory":{"*":"deny","/home/runner/.local/share/opencode/tool-output/*":"deny"},"doom_loop":"deny"},"agent":{"build":{"steps":30}}}'
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          OPENCODE_DISABLE_MODELS_FETCH: "1"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "1"
          OPENCODE_DISABLE_CLAUDE_CODE: "1"
        run: |
          set -euo pipefail
          export "$KEY_NAME=$MODEL_KEY"
          unset MODEL_KEY
          rm -rf opencode.json opencode.jsonc .opencode
          find . -path ./.git -prune -o -type l -exec rm -f -- {} +
          printf '%s' "$TASK" | "$RUNNER_TEMP/opencode/package/bin/opencode" --pure run --model "$MODEL" --agent build
      - run: rm -rf .upseam-check
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.client_payload.sha }}
          path: .upseam-check
          persist-credentials: false
      - name: Copy the listed files into the fresh checkout
        run: |
          set -euo pipefail
          total=0
          while IFS= read -r -d '' f; do
            case "$f" in "" | /* | ../* | */../* | */.. | .git/* | */.git/*) echo "::error::Bad path in files."; exit 1 ;; esac
            if [ -f "$f" ] && [ ! -L "$f" ] && [ -f ".upseam-check/$f" ] && [ ! -L ".upseam-check/$f" ]; then
              total=$((total + $(stat -c %s -- "$f")))
              [ "$total" -le 1048576 ] || { echo "::error::The edits are over 1 MB."; exit 1; }
              cp -- "$f" ".upseam-check/$f"
            fi
          done < <(jq -j '.[] | ., "\u0000"' <<<"$FILES")
      - uses: upseam/action@7b5c3d93de9a0e879364ab4b4415b3acdd138419 # v0.2.0
        with:
          path: .upseam-check
          check-only: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upseam-edits
          path: ${{ runner.temp }}/upseam-edits
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  hermes:
    needs: runner
    if: inputs.runner == 'hermes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HERMES_SHA: f97608f178d1ffeca59860195ab7da295f7c8e5f
      IMAGE: ghcr.io/astral-sh/uv:0.11.6-python3.13-trixie@sha256:b3c543b6c4f23a5f2df22866bd7857e5d304b67a564f4feab6ac22044dde719b
      PROVIDER: ${{ needs.runner.outputs.provider }}
      MODEL: ${{ needs.runner.outputs.id }}
      PROVIDER_HOST: ${{ needs.runner.outputs.host }}
      KEY_NAME: ${{ needs.runner.outputs.key }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.client_payload.sha }}
          path: .upseam-check
          persist-credentials: false
      - name: Copy the listed files into the sandbox directory
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/upseam-work"
          mkdir -p "$work"
          root="$(realpath -- .upseam-check)"
          while IFS= read -r -d '' f; do
            case "$f" in "" | /* | ../* | */../* | */.. | .git/* | */.git/*) echo "::error::Bad path in files."; exit 1 ;; esac
            if [ -f ".upseam-check/$f" ] && [ "$(realpath -e -- ".upseam-check/$f")" = "$root/$f" ]; then
              mkdir -p -- "$work/$(dirname -- "$f")"
              cp -- ".upseam-check/$f" "$work/$f"
            fi
          done < <(jq -j '.[] | ., "\u0000"' <<<"$FILES")
          chmod -R a+rwX "$work"
      - name: Build Hermes Agent from its commit
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hermes-src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/NousResearch/hermes-agent.git "$HERMES_SHA"
          git -C "$src" -c advice.detachedHead=false checkout -q FETCH_HEAD
          [ "$(git -C "$src" rev-parse HEAD)" = "$HERMES_SHA" ]
          docker build -q -t upseam-hermes --build-arg IMAGE -f - "$src" <<'DOCKERFILE'
          ARG IMAGE
          FROM $IMAGE
          WORKDIR /opt/hermes
          COPY . .
          RUN uv sync --locked --no-dev --no-install-project --no-build --no-python-downloads --python 3.13 --extra anthropic && printf 'docker\n' > .install_method
          ENV PATH=/opt/hermes/.venv/bin:$PATH PYTHONDONTWRITEBYTECODE=1
          DOCKERFILE
      - name: Start the egress proxy
        env:
          PROXY_PY: |
            import asyncio, os, time
            ALLOW = set(os.environ["ALLOW"].split(","))
            SLOTS = asyncio.Semaphore(32)
            IDLE = 300
            async def pipe(r, w, seen):
                try:
                    while data := await r.read(65536):
                        seen[0] = time.monotonic()
                        w.write(data)
                        await w.drain()
                    w.close()
                except OSError:
                    w.transport.abort()
            async def handle(r, w):
                if SLOTS.locked():
                    w.close()
                    return
                async with SLOTS:
                    try:
                        head = await asyncio.wait_for(r.readuntil(b"\r\n\r\n"), 10)
                        method, target, _ = head.split(b"\r\n")[0].split(b" ")
                        host, port = target.decode("ascii").rsplit(":", 1)
                        if method != b"CONNECT" or port != "443" or host not in ALLOW:
                            raise PermissionError
                        ur, uw = await asyncio.wait_for(asyncio.open_connection(host, 443), 10)
                    except Exception:
                        print("deny", flush=True)
                        w.write(b"HTTP/1.1 403 Forbidden\r\n\r\n")
                        w.close()
                        return
                    print("allow", host, flush=True)
                    w.write(b"HTTP/1.1 200 Connection established\r\n\r\n")
                    seen = [time.monotonic()]
                    tunnel = asyncio.gather(pipe(r, uw, seen), pipe(ur, w, seen))
                    while not tunnel.done():
                        await asyncio.wait([tunnel], timeout=10)
                        if time.monotonic() - seen[0] > IDLE:
                            uw.transport.abort()
                            w.transport.abort()
            async def main():
                server = await asyncio.start_server(handle, "0.0.0.0", 3128)
                await server.serve_forever()
            asyncio.run(main())
        run: |
          set -euo pipefail
          docker network create --internal -o com.docker.network.bridge.gateway_mode_ipv4=isolated upseam-sandbox
          docker network create upseam-egress
          docker run -d --name upseam-proxy --network upseam-egress \
            --read-only --cap-drop=ALL --security-opt no-new-privileges \
            --user 65534:65534 --pids-limit 64 --memory 128m --memory-swap 128m \
            -e ALLOW="$PROVIDER_HOST" \
            "$IMAGE" python -c "$PROXY_PY"
          docker network connect upseam-sandbox upseam-proxy
      - name: Run Hermes Agent in the sandbox
        env:
          MODEL_KEY: ${{ secrets.model-key }}
          TASK: ${{ github.event.client_payload.task }}
        run: |
          set -euo pipefail
          export "$KEY_NAME=$MODEL_KEY"
          unset MODEL_KEY
          printf '%s' "$TASK" | docker run --rm -i --network upseam-sandbox \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --cap-drop=ALL --security-opt no-new-privileges \
            --user 65534:65534 --pids-limit 256 --memory 2g --memory-swap 2g \
            -v "$RUNNER_TEMP/upseam-work:/work" -w /work \
            -e HOME=/tmp -e HERMES_HOME=/tmp/hermes \
            -e HTTPS_PROXY=http://upseam-proxy:3128 \
            -e HERMES_WRITE_SAFE_ROOT=/work \
            -e TIRITH_ENABLED=0 -e HERMES_DISABLE_LAZY_INSTALLS=1 \
            -e "$KEY_NAME" \
            upseam-hermes \
            python /opt/hermes/hermes chat --safe-mode -Q --query-file - -t file \
            --provider "$PROVIDER" --model "$MODEL" --max-turns 30 >/dev/null 2>&1 || status=$?
          echo "Agent exit code: ${status:-0}"
          exit "${status:-0}"
      - name: Show the proxy log and remove the sandbox
        if: always()
        run: |
          docker logs upseam-proxy || true
          docker rm -f upseam-proxy || true
          docker network rm upseam-sandbox upseam-egress || true
      - name: Copy the edits into the checkout
        run: |
          set -euo pipefail
          work="$(realpath -- "$RUNNER_TEMP/upseam-work")"
          root="$(realpath -- .upseam-check)"
          total=0
          while IFS= read -r -d '' f; do
            case "$f" in "" | /* | ../* | */../* | */.. | .git/* | */.git/*) echo "::error::Bad path in files."; exit 1 ;; esac
            if [ -f "$work/$f" ] && [ "$(realpath -e -- "$work/$f")" = "$work/$f" ] && [ -f ".upseam-check/$f" ] && [ ! -L ".upseam-check/$f" ] && [ "$(realpath -e -- ".upseam-check/$f")" = "$root/$f" ]; then
              total=$((total + $(stat -c %s -- "$work/$f")))
              [ "$total" -le 1048576 ] || { echo "::error::The edits are over 1 MB."; exit 1; }
              cp -- "$work/$f" ".upseam-check/$f"
            fi
          done < <(jq -j '.[] | ., "\u0000"' <<<"$FILES")
      - uses: upseam/action@7b5c3d93de9a0e879364ab4b4415b3acdd138419 # v0.2.0
        with:
          path: .upseam-check
          check-only: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upseam-edits
          path: ${{ runner.temp }}/upseam-edits
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  openclaw:
    needs: runner
    if: inputs.runner == 'openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OPENCLAW_VERSION: 2026.9.6
      OPENCLAW_INTEGRITY: sha512-Ie0kyQSCVfFqixsgVg39vevUDq01Ch5u3+7Yu5Y3qARczmdAe+lzp8bVnO9925rHiW/+CFp70zfORCyPmCH31g==
      IMAGE: node:24.21.0-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
      PROXY_IMAGE: ghcr.io/astral-sh/uv:0.11.6-python3.13-trixie@sha256:b3c543b6c4f23a5f2df22866bd7857e5d304b67a564f4feab6ac22044dde719b
      MODEL: ${{ inputs.model }}
      PROVIDER_HOST: ${{ needs.runner.outputs.host }}
      KEY_NAME: ${{ needs.runner.outputs.key }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.client_payload.sha }}
          path: .upseam-check
          persist-credentials: false
      - name: Copy the listed files into the sandbox directory
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/upseam-work"
          mkdir -p "$work"
          root="$(realpath -- .upseam-check)"
          while IFS= read -r -d '' f; do
            case "$f" in "" | /* | ../* | */../* | */.. | .git/* | */.git/*) echo "::error::Bad path in files."; exit 1 ;; esac
            if [ -f ".upseam-check/$f" ] && [ "$(realpath -e -- ".upseam-check/$f")" = "$root/$f" ]; then
              mkdir -p -- "$work/$(dirname -- "$f")"
              cp -- ".upseam-check/$f" "$work/$f"
            fi
          done < <(jq -j '.[] | ., "\u0000"' <<<"$FILES")
          chmod -R a+rwX "$work"
      - name: Build OpenClaw from its npm release
        env:
          OPENCLAW_CONFIG: |
            {
              update: { checkOnStart: false },
              env: { shellEnv: { enabled: false } },
              agents: {
                defaults: {
                  sandbox: { mode: "off" },
                  skipBootstrap: true,
                  contextInjection: "never",
                  skills: [],
                },
              },
              tools: {
                profile: "coding",
                allow: ["ls", "read", "write", "edit", "apply_patch"],
                deny: ["group:runtime", "group:web", "group:ui", "group:sessions", "group:memory", "group:automation", "group:messaging", "group:nodes", "group:agents", "group:media", "group:openclaw", "group:plugins", "bundle-mcp"],
                fs: { workspaceOnly: true },
                exec: { mode: "deny", applyPatch: { workspaceOnly: true } },
                elevated: { enabled: false },
                codeMode: false,
              },
            }
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/openclaw-image"
          mkdir -p "$ctx"
          jq -n --arg v "$OPENCLAW_VERSION" '{private: true, dependencies: {openclaw: $v}}' > "$ctx/package.json"
          printf '%s' "$OPENCLAW_CONFIG" > "$ctx/openclaw.json5"
          docker build -q -t upseam-openclaw --build-arg IMAGE --build-arg OPENCLAW_INTEGRITY -f - "$ctx" <<'DOCKERFILE'
          ARG IMAGE
          FROM $IMAGE
          ARG OPENCLAW_INTEGRITY
          WORKDIR /opt/openclaw
          COPY package.json openclaw.json5 ./
          RUN npm install --ignore-scripts --no-audit --no-fund --before=2026-09-24T00:00:00Z && [ "$(node -p 'require("./node_modules/.package-lock.json").packages["node_modules/openclaw"].integrity')" = "$OPENCLAW_INTEGRITY" ] && OPENCLAW_DISABLE_BUNDLED_PLUGIN_POSTINSTALL=1 node node_modules/openclaw/scripts/postinstall-bundled-plugins.mjs && test ! -e node_modules/openclaw/.openclaw-lifecycle-pending
          ENV PATH=/opt/openclaw/node_modules/.bin:$PATH
          DOCKERFILE
      - name: Start the egress proxy
        env:
          PROXY_PY: |
            import asyncio, os, time
            ALLOW = set(os.environ["ALLOW"].split(","))
            SLOTS = asyncio.Semaphore(32)
            IDLE = 300
            async def pipe(r, w, seen):
                try:
                    while data := await r.read(65536):
                        seen[0] = time.monotonic()
                        w.write(data)
                        await w.drain()
                    w.close()
                except OSError:
                    w.transport.abort()
            async def handle(r, w):
                if SLOTS.locked():
                    w.close()
                    return
                async with SLOTS:
                    try:
                        head = await asyncio.wait_for(r.readuntil(b"\r\n\r\n"), 10)
                        method, target, _ = head.split(b"\r\n")[0].split(b" ")
                        host, port = target.decode("ascii").rsplit(":", 1)
                        if method != b"CONNECT" or port != "443" or host not in ALLOW:
                            raise PermissionError
                        ur, uw = await asyncio.wait_for(asyncio.open_connection(host, 443), 10)
                    except Exception:
                        print("deny", flush=True)
                        w.write(b"HTTP/1.1 403 Forbidden\r\n\r\n")
                        w.close()
                        return
                    print("allow", host, flush=True)
                    w.write(b"HTTP/1.1 200 Connection established\r\n\r\n")
                    seen = [time.monotonic()]
                    tunnel = asyncio.gather(pipe(r, uw, seen), pipe(ur, w, seen))
                    while not tunnel.done():
                        await asyncio.wait([tunnel], timeout=10)
                        if time.monotonic() - seen[0] > IDLE:
                            uw.transport.abort()
                            w.transport.abort()
            async def main():
                server = await asyncio.start_server(handle, "0.0.0.0", 3128)
                await server.serve_forever()
            asyncio.run(main())
        run: |
          set -euo pipefail
          docker network create --internal -o com.docker.network.bridge.gateway_mode_ipv4=isolated upseam-sandbox
          docker network create upseam-egress
          docker run -d --name upseam-proxy --network upseam-egress \
            --read-only --cap-drop=ALL --security-opt no-new-privileges \
            --user 65534:65534 --pids-limit 64 --memory 128m --memory-swap 128m \
            -e ALLOW="$PROVIDER_HOST" \
            "$PROXY_IMAGE" python -c "$PROXY_PY"
          docker network connect upseam-sandbox upseam-proxy
      - name: Run OpenClaw in the sandbox
        env:
          MODEL_KEY: ${{ secrets.model-key }}
          TASK: ${{ github.event.client_payload.task }}
        run: |
          set -euo pipefail
          export "$KEY_NAME=$MODEL_KEY"
          unset MODEL_KEY
          printf '%s' "$TASK" | docker run --rm -i --network upseam-sandbox \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --cap-drop=ALL --security-opt no-new-privileges \
            --user 65534:65534 --pids-limit 256 --memory 2g --memory-swap 2g \
            -v "$RUNNER_TEMP/upseam-work:/work" -w /tmp \
            -e HOME=/tmp -e CI=true -e DO_NOT_TRACK=1 \
            -e OPENCLAW_NO_AUTO_UPDATE=1 -e OPENCLAW_TELEMETRY=0 \
            -e HTTPS_PROXY=http://upseam-proxy:3128 \
            -e HTTP_PROXY=http://upseam-proxy:3128 \
            -e "$KEY_NAME" \
            upseam-openclaw \
            openclaw agent exec --config /opt/openclaw/openclaw.json5 \
            --cwd /work --message-file - --model "$MODEL" --timeout 900 >/dev/null 2>&1 || status=$?
          echo "Agent exit code: ${status:-0}"
          exit "${status:-0}"
      - name: Show the proxy log and remove the sandbox
        if: always()
        run: |
          docker logs upseam-proxy || true
          docker rm -f upseam-proxy || true
          docker network rm upseam-sandbox upseam-egress || true
      - name: Copy the edits into the checkout
        run: |
          set -euo pipefail
          work="$(realpath -- "$RUNNER_TEMP/upseam-work")"
          root="$(realpath -- .upseam-check)"
          total=0
          while IFS= read -r -d '' f; do
            case "$f" in "" | /* | ../* | */../* | */.. | .git/* | */.git/*) echo "::error::Bad path in files."; exit 1 ;; esac
            if [ -f "$work/$f" ] && [ "$(realpath -e -- "$work/$f")" = "$work/$f" ] && [ -f ".upseam-check/$f" ] && [ ! -L ".upseam-check/$f" ] && [ "$(realpath -e -- ".upseam-check/$f")" = "$root/$f" ]; then
              total=$((total + $(stat -c %s -- "$work/$f")))
              [ "$total" -le 1048576 ] || { echo "::error::The edits are over 1 MB."; exit 1; }
              cp -- "$work/$f" ".upseam-check/$f"
            fi
          done < <(jq -j '.[] | ., "\u0000"' <<<"$FILES")
      - uses: upseam/action@7b5c3d93de9a0e879364ab4b4415b3acdd138419 # v0.2.0
        with:
          path: .upseam-check
          check-only: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upseam-edits
          path: ${{ runner.temp }}/upseam-edits
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  push:
    needs: [runner, claude-code, codex, opencode, hermes, openclaw]
    if: ${{ !cancelled() && needs.runner.result == 'success' && (needs.claude-code.result == 'success' || needs.codex.result == 'success' || needs.opencode.result == 'success' || needs.hermes.result == 'success' || needs.openclaw.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upseam-edits
          path: ${{ runner.temp }}/upseam-edits
      - name: Copy the listed files over the checkout
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/upseam-edits"
          total=0
          while IFS= read -r -d '' f; do
            case "$f" in "" | /* | ../* | */../* | */.. | .git/* | */.git/*) echo "::error::Bad path in files."; exit 1 ;; esac
            if [ -f "$src/$f" ] && [ ! -L "$src/$f" ] && [ -f "$f" ] && [ ! -L "$f" ]; then
              total=$((total + $(stat -c %s -- "$src/$f")))
              [ "$total" -le 1048576 ] || { echo "::error::The edits are over 1 MB."; exit 1; }
              cp -- "$src/$f" "$f"
            fi
          done < <(jq -j '.[] | ., "\u0000"' <<<"$FILES")
      - uses: upseam/action@7b5c3d93de9a0e879364ab4b4415b3acdd138419 # v0.2.0
